name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  app:
    name: typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    env:
      # Build-time placeholders. Real values live in Cloudflare Worker secrets
      # (wrangler secret put) in production and .dev.vars in dev.
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_APP_NAME: "Mắt Việt HR"
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      # Verify the actual deployable artifact — the OpenNext→Cloudflare Worker
      # bundle that `npm run deploy` produces (a superset of `next build`). This
      # is where Cloudflare-specific bundling issues surface (e.g. the cloudflare:*
      # / agents package quirk). It cannot be built on the Windows dev box
      # (workerd crashes on the diacritics repo path), so Linux CI is the first
      # place it runs. Non-blocking for now: once it's proven green on a real
      # run, drop `continue-on-error` to make it a required gate before deploy.
      - name: Build Cloudflare Worker bundle (deploy artifact)
        run: npx opennextjs-cloudflare build
        continue-on-error: true

  gitleaks:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  e2e:
    name: e2e (playwright + axe)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    env:
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_APP_NAME: "Mắt Việt HR"
      CRON_SECRET: ci-e2e-secret
      BETTER_AUTH_SECRET: ci-e2e-auth-secret
      ALLOW_DEMO_SEED: "true"
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Prepare local D1 + dev vars
        run: |
          printf 'CRON_SECRET=ci-e2e-secret\nBETTER_AUTH_SECRET=ci-e2e-auth-secret\nALLOW_DEMO_SEED=true\n' > .dev.vars
          npm run db:migrate:local
      - name: Run e2e
        run: npx playwright test
      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: app/playwright-report
          retention-days: 7
